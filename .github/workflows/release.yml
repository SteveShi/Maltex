name: Build and Release

on:
  push:
    branches:
      - main
    paths:
      - 'CHANGELOG.md'
  workflow_dispatch:

jobs:
  inspect:
    name: Inspect Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
      version_tag: ${{ steps.get_version.outputs.VERSION_TAG }}
      skipped: ${{ steps.check_version.outputs.skipped }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Extract Version from Changelog
        id: get_version
        run: |
          VERSION=$(sed -n '/## \[/p' CHANGELOG.md | head -n 1 | cut -d'[' -f2 | cut -d']' -f1)
          if [ -z "$VERSION" ]; then
            echo "Error: Could not extract version from CHANGELOG.md"
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION_TAG=v$VERSION" >> $GITHUB_OUTPUT
          echo "Detected Version: $VERSION"

      - name: Check If Version Already Released
        id: check_version
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.get_version.outputs.VERSION }}"
          if gh release view "$TAG" >/dev/null 2>&1 && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Version $TAG already exists. Skipping release."
            echo "skipped=true" >> $GITHUB_OUTPUT
          else
            echo "skipped=false" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build and Release
    needs: inspect
    if: needs.inspect.outputs.skipped != 'true'
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Prepare Environment
        run: |
          echo "VERSION=${{ needs.inspect.outputs.version }}" >> $GITHUB_ENV
          echo "VERSION_TAG=${{ needs.inspect.outputs.version_tag }}" >> $GITHUB_ENV

      - name: Install Tools
        run: |
          brew install xcodegen
          brew install create-dmg

      - name: Set up Xcode
        uses: SteveShi/setup-xcode@v2
        with:
          xcode-version: 'latest-stable'

      - name: Generate Project
        run: xcodegen

      - name: Resolve Package Dependencies
        run: xcodebuild -resolvePackageDependencies -scheme Maltex -project Maltex.xcodeproj

      - name: Build Apple Silicon (arm64) App
        run: |
          VERSION_CLEAN=${{ env.VERSION }}
          xcodebuild build \
            -scheme Maltex \
            -destination "platform=macOS,arch=arm64" \
            -configuration Release \
            -derivedDataPath ./DerivedData/arm64 \
            MARKETING_VERSION=$VERSION_CLEAN \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            ENABLE_APP_INTENTS_METADATA_EXTRACTION=NO \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS=arm64 \
            MACOSX_DEPLOYMENT_TARGET=14.0 \
            SWIFT_STRICT_CONCURRENCY=minimal \
            COMPILER_INDEX_STORE_ENABLE=NO \
            -skipPackageUpdates

      - name: Build Intel (x86_64) App
        run: |
          VERSION_CLEAN=${{ env.VERSION }}
          xcodebuild build \
            -scheme Maltex \
            -destination "platform=macOS,arch=x86_64" \
            -configuration Release \
            -derivedDataPath ./DerivedData/x86_64 \
            MARKETING_VERSION=$VERSION_CLEAN \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            ENABLE_APP_INTENTS_METADATA_EXTRACTION=NO \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=x86_64 \
            MACOSX_DEPLOYMENT_TARGET=14.0 \
            SWIFT_STRICT_CONCURRENCY=minimal \
            COMPILER_INDEX_STORE_ENABLE=NO \
            -skipPackageUpdates

      - name: Package arm64 App
        run: |
          mkdir -p Build/arm64/Maltex.app
          cp -R ./DerivedData/arm64/Build/Products/Release/Maltex.app/ Build/arm64/Maltex.app/
          
          # Ensure arm64 bundled engine binaries are present
          cp extra/darwin/arm64/engine/aria2c Build/arm64/Maltex.app/Contents/Resources/aria2c
          cp extra/darwin/arm64/engine/aria2-next Build/arm64/Maltex.app/Contents/Resources/aria2-next
          cp extra/darwin/arm64/engine/aria2.conf Build/arm64/Maltex.app/Contents/Resources/aria2.conf
          chmod +x Build/arm64/Maltex.app/Contents/Resources/aria2c Build/arm64/Maltex.app/Contents/Resources/aria2-next
          
          # Ad-hoc sign arm64 app deeply
          codesign --force --deep --sign - --options=runtime --entitlements Maltex/Maltex.entitlements Build/arm64/Maltex.app

      - name: Package x86_64 App
        run: |
          mkdir -p Build/x86_64/Maltex.app
          cp -R ./DerivedData/x86_64/Build/Products/Release/Maltex.app/ Build/x86_64/Maltex.app/
          
          # Replace with genuine x86_64 bundled engine binaries
          cp extra/darwin/x64/engine/aria2c Build/x86_64/Maltex.app/Contents/Resources/aria2c
          cp extra/darwin/x64/engine/aria2-next Build/x86_64/Maltex.app/Contents/Resources/aria2-next
          cp extra/darwin/x64/engine/aria2.conf Build/x86_64/Maltex.app/Contents/Resources/aria2.conf
          chmod +x Build/x86_64/Maltex.app/Contents/Resources/aria2c Build/x86_64/Maltex.app/Contents/Resources/aria2-next
          
          # Ad-hoc sign x86_64 app deeply
          codesign --force --deep --sign - --options=runtime --entitlements Maltex/Maltex.entitlements Build/x86_64/Maltex.app

      - name: Create DMGs and ZIPs
        id: create_assets
        run: |
          VERSION=${{ env.VERSION }}
          
          # 1. arm64 ZIP
          cd Build/arm64
          zip -qy -r "../../Maltex-${VERSION}-arm64.zip" "Maltex.app"
          cd -

          # 2. arm64 DMG
          create-dmg \
            --volname "Maltex Installer (Apple Silicon)" \
            --volicon "Maltex/Assets.xcassets/AppIcon.appiconset/icon.png" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "Maltex.app" 200 190 \
            --hide-extension "Maltex.app" \
            --app-drop-link 600 185 \
            "Maltex-${VERSION}-arm64.dmg" \
            "Build/arm64/Maltex.app"

          # 3. x86_64 ZIP
          cd Build/x86_64
          zip -qy -r "../../Maltex-${VERSION}-x86_64.zip" "Maltex.app"
          cd -

          # 4. x86_64 DMG
          create-dmg \
            --volname "Maltex Installer (Intel)" \
            --volicon "Maltex/Assets.xcassets/AppIcon.appiconset/icon.png" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "Maltex.app" 200 190 \
            --hide-extension "Maltex.app" \
            --app-drop-link 600 185 \
            "Maltex-${VERSION}-x86_64.dmg" \
            "Build/x86_64/Maltex.app"

      - name: Extract Release Notes (en & zh)
        run: |
          VERSION_CLEAN=${{ env.VERSION }}
          awk "/^## \[$VERSION_CLEAN\]/{flag=1;next} /^## \[/{flag=0} flag" CHANGELOG.md > full_notes.md
          
          if [ ! -s full_notes.md ]; then
            echo "Release for version $VERSION_CLEAN. Check CHANGELOG.md for details." > release_notes_en.md
            cp release_notes_en.md release_notes_zh.md
          else
            sed -n '1,/### Chinese/p' full_notes.md | grep -v "### Chinese" > release_notes_en.md
            sed -n '/### Chinese/,$p' full_notes.md | sed '1d' > release_notes_zh.md
            
            if [ ! -s release_notes_zh.md ]; then cp release_notes_en.md release_notes_zh.md; fi
            if [ ! -s release_notes_en.md ]; then cp full_notes.md release_notes_en.md; fi
          fi
          cp full_notes.md release_notes.md

      - name: Generate Sparkle Appcast
        env:
          SPARKLE_SECRET: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SPARKLE_VERSION=$(gh api repos/sparkle-project/Sparkle/releases/latest --jq '.tag_name' | sed 's/^v//')
          curl -fL -H "User-Agent: curl" -o Sparkle.tar.xz "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          tar -xf Sparkle.tar.xz
          CLEAN_KEY=$(echo "$SPARKLE_SECRET" | sed 's/EdDSAPrivateKey://' | tr -dc 'A-Za-z0-9+/=')
          
          if [ -z "$CLEAN_KEY" ]; then
            echo "ERROR: SPARKLE_PRIVATE_KEY secret is missing!"
            exit 1
          fi

          mkdir -p deploy
          cp "$GITHUB_WORKSPACE/Maltex-${VERSION}-arm64.zip" deploy/
          cp "$GITHUB_WORKSPACE/Maltex-${VERSION}-x86_64.zip" deploy/
          cp release_notes_en.md "deploy/release_notes_en.md"
          cp release_notes_zh.md "deploy/release_notes_zh.md"
          cp release_notes_en.md "deploy/release_notes.md"
          
          export DYLD_FRAMEWORK_PATH="$PWD"
          echo "$CLEAN_KEY" | ./bin/generate_appcast \
            --ed-key-file - \
            --download-url-prefix "https://github.com/SteveShi/Maltex/releases/download/${{ env.VERSION_TAG }}/" \
            deploy/
          
          if [ -f "deploy/appcast.xml" ]; then
            mv deploy/appcast.xml .
            sed -i.bak '/<description>/d' appcast.xml
            sed -i.bak '/<sparkle:releaseNotesLink>/d' appcast.xml
            
            EN_LINK="https://github.com/SteveShi/Maltex/releases/download/${{ env.VERSION_TAG }}/release_notes_en.md"
            ZH_LINK="https://github.com/SteveShi/Maltex/releases/download/${{ env.VERSION_TAG }}/release_notes_zh.md"
            
            sed -i.bak "/<enclosure/i\\
            <sparkle:releaseNotesLink xml:lang=\"en\">$EN_LINK</sparkle:releaseNotesLink>" appcast.xml
            sed -i.bak "/<enclosure/i\\
            <sparkle:releaseNotesLink xml:lang=\"zh-Hans\">$ZH_LINK</sparkle:releaseNotesLink>" appcast.xml
            
            rm appcast.xml.bak
          else
            echo "ERROR: generate_appcast failed to produce appcast.xml."
            exit 1
          fi

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: Release ${{ env.VERSION_TAG }}
          draft: false
          prerelease: false
          body_path: release_notes.md
          files: |
            Maltex-*-arm64.zip
            Maltex-*-arm64.dmg
            Maltex-*-x86_64.zip
            Maltex-*-x86_64.dmg
            release_notes_en.md
            release_notes_zh.md
            appcast.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew Cask
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${{ env.VERSION }}"
          ARM64_SHA=$(shasum -a 256 "Maltex-${VERSION}-arm64.dmg" | awk '{print $1}')
          X86_SHA=$(shasum -a 256 "Maltex-${VERSION}-x86_64.dmg" | awk '{print $1}')
          
          git clone https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/SteveShi/homebrew-tap.git tap-repo
          cd tap-repo
          
          sed -i '' "s/version \".*\"/version \"$VERSION\"/" Casks/maltex.rb
          sed -i '' "s/sha256 arm:.*intel:.*/sha256 arm: \"$ARM64_SHA\", intel: \"$X86_SHA\"/" Casks/maltex.rb || sed -i '' "s/sha256 \".*\"/sha256 \"$ARM64_SHA\"/" Casks/maltex.rb
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/maltex.rb
          git commit -m "Update maltex to $VERSION" || true
          git push || true
